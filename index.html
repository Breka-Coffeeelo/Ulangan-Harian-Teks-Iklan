<style>

.w{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.c{background:var(--sf);border:2px solid var(--bd);border-radius:24px 24px 24px 6px;padding:22px;margin-bottom:18px;box-shadow:6px 6px 0 var(--bd)}

button.g{background:transparent;color:var(--tx);border:2px solid var(--bd)}
button.d{background:var(--er);color:#fff}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pr);color:var(--pt);padding:10px 18px;border-radius:0 0 22px 22px;font-size:14px;font-weight:600}

#vc{background:rgba(255,255,255,.2);padding:3px 12px;border-radius:99px}
#qa{counter-reset:opt}
.o{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--bd);border-radius:16px;margin:10px 0;cursor:pointer;position:relative;counter-increment:opt}
.o::before{content:counter(opt,upper-alpha);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--bg);color:var(--pr);border:2px solid var(--bd)}
.o.b::before{content:'●';font-size:10px}
.o input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.o:has(input:checked){background:var(--pr);color:var(--pt);border-color:var(--pr)}
.o:has(input:checked)::before{background:var(--hl);color:#171533;border-color:var(--hl)}
.o:has(input:focus-visible){outline:3px solid var(--hl);outline-offset:2px}
.tx{white-space:pre-line;background:var(--bg);border-left:4px solid var(--ac);padding:10px 14px;margin:10px 0;font-style:italic;border-radius:0 12px 12px 0}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px}
.nav button{padding:0;height:42px;border-radius:50%;background:var(--sf);color:var(--tx);border:2px solid var(--bd);font-size:14px}
.nav .a{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.nav .n{box-shadow:0 0 0 3px var(--sf),0 0 0 6px var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.m{position:fixed;inset:0;background:rgba(16,15,36,.82);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.m>div{background:var(--sf);border:3px solid var(--ac);border-radius:28px 28px 28px 6px;padding:26px;max-width:440px;width:100%;box-shadow:8px 8px 0 var(--ac)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;background:var(--hl);color:#171533}
.big{font-size:64px;font-weight:800;color:var(--ac);line-height:1}
.hide{display:none}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:10px;border-radius:12px;font-size:12px;max-height:120px;overflow:auto;user-select:text}
.lg{min-height:100vh;display:grid}
.hero{background:var(--pr);color:var(--pt);padding:40px 24px 48px;display:flex;flex-direction:column;justify-content:center;border-radius:0 0 36px 36px}
.hero h1{font-size:clamp(52px,14vw,96px);font-weight:800;line-height:.95;margin:18px 0 12px}
.hero p{margin:0 0 18px;font-size:18px;font-weight:600}
.chip{align-self:flex-start;background:var(--hl);color:#171533;font-weight:700;font-size:14px;padding:4px 14px;border-radius:99px}
.rl{margin:0;padding-left:20px;font-size:15px;max-width:440px;opacity:.92}.rl li{margin:6px 0}
.fm{padding:28px 24px 40px;max-width:460px;width:100%;margin:0 auto;align-self:center}
@media(min-width:820px){.lg{grid-template-columns:1.1fr 1fr}.hero{border-radius:0 36px 36px 0;padding:60px}.fm{padding:40px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}

pg("Tujuan utama iklan komersial adalah…",["memberi hukuman","mengajak masyarakat menghemat air","menarik perhatian dan mengajak orang membeli","menyampaikan berita terbaru"]);

pg("Ciri iklan media sosial yang benar adalah…",["panjang dan sangat rinci","singkat, jelas, dan menarik sejak awal","tanpa ajakan apa pun","tanpa gambar atau video"]);

pg("Kekurangan utama iklan zaman dulu dibanding iklan media sosial adalah…",["harganya mahal","komunikasinya satu arah","durasinya terlalu panjang","tidak memakai kata-kata"]);
pg("Televisi dan radio merupakan media untuk iklan…",["cetak","layanan masyarakat","elektronik","luar ruang"]);
pg("Kalimat “Cuma Rp25 ribu” lebih meyakinkan daripada “Harganya murah” karena…",["lebih panjang","memakai kata yang spesifik","memakai kata kasar","melebih-lebihkan keadaan"]);

pg("Pada rumus AIDA, bagian Desire berfungsi untuk…",["membuat orang berhenti dan melihat","memberi fakta menarik","membangun keinginan memiliki atau mencoba","mengajak orang membeli sekarang"]);
pg("Pada rumus P-A-S, bagian Agitate berfungsi untuk…",["menyebut nama produk","membuat masalah terasa nyata tanpa menakut-nakuti atau berbohong","menutup iklan dengan ajakan","mengumumkan diskon"]);
pg("“Segarnya bikin dunia berhenti sejenak!” menggunakan gaya bahasa…",["personifikasi","repetisi","hiperbola","pertanyaan retoris"]);
pg("“Sepatu ini setia menemani langkahmu.” menggunakan gaya bahasa…",["hiperbola","personifikasi","repetisi","pertanyaan retoris"]);
pg("“Hemat, hemat, dan hemat!” menggunakan gaya bahasa…",["repetisi","personifikasi","hiperbola","pertanyaan retoris"]);
pg("“Siapa yang tidak mau nilai bagus?” menggunakan gaya bahasa…",["hiperbola","personifikasi","repetisi","pertanyaan retoris"]);
pg("Hal yang tidak boleh dilakukan dalam membuat iklan adalah…",["memakai bahasa sesuai target pembaca","menyampaikan informasi yang tidak sesuai manfaat produk","memakai visual yang kuat","memberi ajakan yang jelas"]);
pg("Perhatikan iklan berikut!\n“"+P1+"”\nGagasan pokok iklan tersebut adalah…",["Ransel Gesit berat dan murah","Diskon 20% berlaku sepanjang tahun","Ransel Gesit ringan, muat banyak, tahan hujan, dan sedang diskon minggu ini","Pundak pegal tidak ada obatnya"]);
pg("Informasi tersurat dalam iklan Ransel Gesit di atas adalah…",["Ransel Gesit tahan hujan","Ransel Gesit paling laris","Ransel Gesit cocok untuk semua usia","Ransel Gesit terbuat dari kulit"]);
pg("Makna tersirat kalimat “Diskon 20% khusus minggu ini saja” adalah…",["diskon berlaku selamanya","pembaca didorong segera membeli sebelum diskon habis","produk tidak laku","harga akan naik dua kali lipat"]);
pg("Iklan “Matchadepan”: “Dijamin masa depan anda akan cerah, secerah matcha spesial kami. Discount 20%.” Produk yang ditawarkan adalah…",["kopi hitam","minuman matcha","teh melati","es krim"]);
pg("Makna tersirat kalimat “Dijamin masa depan anda akan cerah, secerah matcha spesial kami” adalah…",["toko buka sampai malam","matcha berwarna kuning","matcha menyehatkan mata","minum matcha ini membawa harapan dan hal baik"]);
pg("Platform yang cocok untuk video pendek dengan tren cepat dan sasaran anak muda adalah…",["YouTube","Facebook","TikTok","Koran digital"]);
pg("Salah satu tugas copywriter adalah…",["mengemudikan kendaraan promosi","menulis caption, slogan, dan skrip video","menjual barang langsung di toko","memperbaiki gawai"]);
// ===== PILIHAN GANDA KOMPLEKS (6) =====
pk("Pilih SEMUA ciri iklan media sosial yang benar!",["Singkat dan jelas","Menarik sejak awal","Visual kuat","Tidak memakai ajakan","Memakai kata kasar"]);
pk("Pilih SEMUA yang termasuk iklan cetak!",["Baliho","Koran","Televisi","Brosur","Radio"]);
pk("Pilih SEMUA gaya bahasa yang sering dipakai dalam iklan!",["Hiperbola","Personifikasi","Repetisi","Pantun","Pertanyaan retoris"]);
pk("Pilih SEMUA hal yang tidak boleh dilakukan dalam iklan!",["Menipu pembaca","Memakai kata kasar atau menghina pihak lain","Menyebarkan hoaks","Memakai kata yang spesifik","Memberi ajakan yang jelas"]);
pk("Pilih SEMUA pekerjaan seorang copywriter!",["Menulis caption dan slogan","Riset tentang produk dan pembaca","Menyesuaikan gaya bahasa tiap platform","Bekerja sama dengan desainer dan pembuat video","Memperbaiki mesin percetakan"]);
pk("Pilih SEMUA bagian rumus Hook-Isi-Ajakan!",["Hook","Isi","Ajakan","Sampiran","Agitate"]);
// ===== BENAR / SALAH (6) =====
bs("Iklan bertujuan menarik perhatian dan mengajak orang bertindak.");
bs("Iklan hanya digunakan untuk jualan.");
bs("Komunikasi pada iklan media sosial hanya berlangsung satu arah.");
bs("Pada rumus P-A-S, langkah pertama adalah Problem.");
bs("Pada bagian Agitate, penulis boleh menakut-nakuti atau berbohong.");
bs("“Cuma Rp25 ribu” lebih meyakinkan daripada “Harganya murah”.");
// ===== MENJODOHKAN (4) =====
mt("Jodohkan jenis iklan dengan contohnya!",["Iklan cetak","Iklan elektronik","Iklan layanan masyarakat","Iklan media sosial"],["Baliho di pinggir jalan","Jeda iklan di televisi","Ajakan tertib berlalu lintas","Reels dengan tombol untuk diklik"]);
mt("Jodohkan bagian iklan dengan contoh kalimatnya!",["Hook","Isi","Ajakan","Pemicu"],["Pundakmu pegal bawa tas berat?","Ransel ringan, muat banyak buku","Klik link di bio sekarang!","Diskon hanya minggu ini"]);
mt("Jodohkan gaya bahasa dengan contohnya!",["Hiperbola","Personifikasi","Repetisi","Pertanyaan retoris"],["Segarnya bikin dunia berhenti sejenak!","Sepatu ini setia menemani langkahmu.","Hemat, hemat, dan hemat!","Siapa yang tidak mau nilai bagus?"]);
mt("Jodohkan platform dengan kecocokannya!",["TikTok","Instagram","YouTube","Facebook"],["Video pendek dan tren cepat","Foto dan Reels rapi dan estetik","Tutorial dan ulasan video panjang","Jualan lokal dan acara"]);
// ===== ESAI (5) =====
es("Jelaskan pengertian teks iklan dan sebutkan tiga ciri iklan media sosial!");
es("Jelaskan tiga perbedaan iklan zaman dulu (cetak/elektronik) dengan iklan media sosial!");
es("Perhatikan iklan berikut!\n“Bosan minuman cepat hangat? Botol Sejuk menjaga minumanmu tetap dingin 12 jam. Cuma Rp45 ribu! Pesan sekarang lewat DM admin.”\nTunjukkan hook, isi, dan ajakan pada iklan tersebut!");
es("Tulislah iklan 3–4 kalimat untuk produk fiktif pilihanmu dengan rumus AIDA atau P-A-S! Sebutkan rumus yang kamu pakai.");
es("Mengapa iklan tidak boleh berisi informasi bohong? Berikan dua alasan, lalu jelaskan makna tersirat iklan “Matchadepan” (masa depan cerah secerah matcha)!");
const NO=Q.filter(q=>q.y!=='es').length;
const TY={pg:'Pilihan Ganda',pk:'Pilihan Ganda Kompleks',bs:'Benar / Salah',mt:'Menjodohkan',es:'Esai'};
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const app=$('app');let timer,last=0,devo=false,locked=false;
const IS_MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)||matchMedia('(pointer:coarse)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function login(msg){
 app.innerHTML=`<div class="lg"><section class="hero"><span class="chip">Ulangan Harian · Bahasa Indonesia</span><h1>Teks Iklan</h1><p>${NO+5} soal (${NO} objektif + 5 esai) · ${DUR} menit</p><ul class="rl"><li>Ujian berjalan dalam layar penuh.</li><li>Pindah tab, keluar layar penuh, salin/tempel, dan memuat ulang halaman dicatat sebagai pelanggaran.</li><li>Pelanggaran ke-${MAX} mengumpulkan ujian otomatis dan dilaporkan ke guru.</li></ul></section>
 <section class="fm"><h2>Masuk ujian</h2>${msg?`<div style="color:var(--er);font-weight:600;margin-bottom:8px">${msg}</div>`:''}
 <label>Nama lengkap<input id="nm" autocomplete="off"></label><label>Kelas<input id="kl" placeholder="mis. X-3" autocomplete="off"></label><label>Token ujian (dari guru)<input id="tk" autocomplete="off"></label>
 <button onclick="begin()">Mulai ujian</button> <button class="g" onclick="teacher()">Mode Guru</button></section></div>`;
}
async function begin(){
 const nm=$('nm').value.trim(),kl=$('kl').value.trim(),tk=$('tk').value.trim();
 if(!nm||!kl||!tk)return login('Nama, kelas, dan token wajib diisi.');
 if(!SHEET_URL)return login('Alamat server (SHEET_URL) belum diisi di file HTML. Hubungi guru.');
 const keluarFS=()=>{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}};
 audioInit();fs();
 let j;
 try{j=await(await fetch(SHEET_URL+'?'+new URLSearchParams({a:'start',tk,n:nm,k:kl}))).json()}
 catch(e){keluarFS();return login('Tidak dapat terhubung ke server. Periksa internet lalu coba lagi.')}
 if(!j.ok){keluarFS();return login(j.err==='token'?'Token ujian salah.':j.err==='closed'?'Ujian belum dibuka atau sudah ditutup oleh guru.':'Gagal memulai ujian. Periksa nama dan kelas.')}
 const g={};Q.forEach((q,i)=>(g[q.y]=g[q.y]||[]).push(i));
 const order=[].concat(...Object.keys(g).map(k=>sh(g[k])));
 const perm=Q.map(q=>q.o?sh(q.o.map((_,i)=>i)):null);
 S={nm,kl,order,perm,ans:{},viol:[],i:0,start:Date.now(),id:j.id,sig:j.sig,done:false,nodes:0};save();
 audioInit();fs();run();
}
let AC=null,pendBip=0;
function audioInit(){if(!SUARA)return;
 try{
  // iOS: abaikan tombol silent, anggap audio sebagai "playback"
  if(navigator.audioSession)navigator.audioSession.type='playback';
  if(!AC||AC.state==='closed'){
   AC=new(window.AudioContext||window.webkitAudioContext)();
   AC.onstatechange=()=>{if(AC.state!=='running'&&!document.hidden)AC.resume().catch(()=>{})};
  }
  if(AC.state!=='running'){
   // iOS menandai 'interrupted' (bukan hanya 'suspended') setelah pindah app/layar
   AC.resume().then(flushBip).catch(()=>{});
   const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);
  }
 }catch(e){}
}
function flushBip(){if(pendBip&&AC&&AC.state==='running'){const p=pendBip;pendBip=0;playBip(p)}}
function playBip(n){
 try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime,d=n===2?1.2:0.5;
  o.type='square';o.frequency.value=n===2?440:880;
  g.gain.setValueAtTime(SUARA_VOL,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function bip(n){
 if(!SUARA)return;
 if(!AC)audioInit();
 if(!AC)return;
 if(AC.state==='running')return playBip(n);
 pendBip=n;AC.resume().then(flushBip).catch(()=>{});
}
// Nyalakan ulang suara setiap kali ada sentuhan / kembali ke halaman (syarat iOS: harus dari gestur pengguna)
['touchstart','touchend','pointerdown','click'].forEach(e=>document.addEventListener(e,()=>{if(AC&&AC.state!=='running')audioInit()},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)audioInit()});
addEventListener('pageshow',audioInit);
document.addEventListener('webkitfullscreenchange',audioInit);
document.addEventListener('fullscreenchange',audioInit);
function fs(){try{const e=document.documentElement;e.requestFullscreen&&e.requestFullscreen()}catch(e){}}
function run(){setTimeout(hb,500);
 app.innerHTML=`<div class="top"><b id="who"></b><span id="tm"></span><span id="vc"></span></div><div class="w"><div class="c" id="qa"></div><div class="c"><div class="mu" style="margin-bottom:8px">Navigasi soal (kuning = soal sekarang, hijau = terjawab)</div><div class="nav" id="nv"></div><div class="row"><span></span><button class="d" onclick="ask()">Kumpulkan Ujian</button></div></div></div>`;
 $('who').textContent=S.nm+' · '+S.kl;draw();tick();clearInterval(timer);timer=setInterval(tick,1000);
}
function tick(){
 const left=S.start+DUR*60000+(S.extra||0)-Date.now();if(left<=0)return finish('Waktu habis');
 const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;
 $('tm').textContent='⏱ '+m+':'+String(s).padStart(2,'0');
 $('vc').textContent='⚠ '+S.viol.filter(v=>!v.s).length+'/'+MAX;
 if(!IS_MOBILE){
  if(!S.done&&!devo&&(outerWidth-innerWidth>220||outerHeight-innerHeight>220)){devo=true;v('Indikasi DevTools / layar terbagi')}
  else if(outerWidth-innerWidth<=220&&outerHeight-innerHeight<=220)devo=false;
 }
}
const ok=i=>{const q=Q[i],a=S.ans[i];if(q.y==='mt')return a&&q.p.every((_,j)=>a[j]!==undefined&&a[j]!=='');if(q.y==='pk')return a&&a.length;if(q.y==='es')return a&&a.trim().length>0;return a!==undefined};
function draw(){
 const qi=S.order[S.i],q=Q[qi],a=S.ans[qi];let h=`<span class="tag">${TY[q.y]}</span> <span class="mu">Soal ${S.i+1} dari ${Q.length}</span><p style="white-space:pre-line;margin-top:12px">${esc(q.t)}</p>`;
 if(q.y==='pg')h+=S.perm[qi].map(p=>`<label class="o"><input type="radio" name="r" ${a===p?'checked':''} onchange="set(${qi},${p})">${esc(q.o[p])}</label>`).join('');
 if(q.y==='pk')h+=`<div class="mu">Boleh memilih lebih dari satu.</div>`+S.perm[qi].map(p=>`<label class="o"><input type="checkbox" ${a&&a.includes(p)?'checked':''} onchange="tog(${qi},${p})">${esc(q.o[p])}</label>`).join('');
 if(q.y==='bs')h+=[[true,'Benar'],[false,'Salah']].map(([v,l])=>`<label class="o b"><input type="radio" name="r" ${a===v?'checked':''} onchange="set(${qi},${v})">${l}</label>`).join('');
 if(q.y==='mt')h+=q.p.map((p,j)=>`<div style="margin-top:10px"><b>${esc(p)}</b><select onchange="mset(${qi},${j},this.value)"><option value="">— pilih —</option>${S.perm[qi].map(k=>`<option value="${k}" ${a&&a[j]==k&&a[j]!==''?'selected':''}>${esc(q.o[k])}</option>`).join('')}</select></div>`).join('');
 if(q.y==='es')h+=`<textarea rows="7" placeholder="Tulis jawaban esai di sini…" oninput="set(${qi},this.value,1)">${esc(a||'')}</textarea>`;
 h+=`<div class="row"><button class="g" ${S.i?'':'disabled'} onclick="go(-1)">← Sebelumnya</button><button onclick="go(1)" ${S.i<Q.length-1?'':'disabled'}>Berikutnya →</button></div>`;
 $('qa').innerHTML=h;nav();
}
function nav(){$('nv').innerHTML=S.order.map((qi,n)=>`<button class="${ok(qi)?'a':''} ${n===S.i?'n':''}" onclick="S.i=${n};save();draw()">${n+1}</button>`).join('')}
function set(qi,val,soft){S.ans[qi]=val;save();if(!soft||true)nav()}
function tog(qi,p){const a=S.ans[qi]||[];S.ans[qi]=a.includes(p)?a.filter(x=>x!==p):a.concat(p);save();nav()}
function mset(qi,j,val){const a=S.ans[qi]||[];a[j]=val;S.ans[qi]=a;save();nav()}
function go(d){S.i+=d;save();draw();scrollTo(0,0)}
function modal(h){let m=$('md');if(!m){m=document.createElement('div');m.id='md';m.className='m';document.body.appendChild(m)}m.innerHTML='<div>'+h+'</div>'}
function closeM(){const m=$('md');m&&m.remove()}
function ask(){const n=Q.filter((_,i)=>!ok(i)).length;modal(`<h2>Kumpulkan ujian?</h2><p>${n?`Masih ada <b>${n}</b> soal belum terjawab.`:'Semua soal sudah terjawab.'} Jawaban tidak dapat diubah setelah dikumpulkan.</p><div class="row"><button class="g" onclick="closeM()">Kembali</button><button class="d" onclick="finish('Dikumpulkan siswa')">Ya, kumpulkan</button></div>`)}
// ===== DETEKSI KECURANGAN =====
function v(msg,soft){
 if(!S||S.done||!S.start||locked)return;
 const now=Date.now();if(now-last<2000)return;last=now;
 S.viol.push({t:new Date().toLocaleTimeString('id-ID'),m:msg,s:soft?1:0});save();
 if(soft){return}
 const c=S.viol.filter(x=>!x.s).length;
 bip(c>=MAX?2:1);
 if(c>=MAX)return finish('Melebihi batas pelanggaran');
 locked=true;modal(`<h2 style="color:var(--er)">⚠ Pelanggaran terdeteksi</h2><p>${esc(msg)}</p><p>Pelanggaran <b>${c} dari ${MAX}</b>. Pada pelanggaran ke-${MAX} ujian otomatis dikumpulkan dan dilaporkan ke guru.</p><button onclick="locked=false;closeM();audioInit();fs();last=Date.now()">Kembali ke ujian</button>`);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)v('Berpindah tab / aplikasi')});
addEventListener('blur',()=>setTimeout(()=>{if(S&&Date.now()-S.start>3000&&!document.hasFocus()&&!document.hidden)v('Jendela ujian kehilangan fokus')},150));
document.addEventListener('fullscreenchange',()=>{if(S&&!S.done&&S.start&&!document.fullscreenElement&&document.documentElement.requestFullscreen)v('Keluar dari layar penuh')});
['copy','cut','paste','dragstart'].forEach(e=>document.addEventListener(e,x=>{if(S&&!S.done){x.preventDefault();v('Mencoba '+(e==='paste'?'menempel':'menyalin')+' teks')}}));
document.addEventListener('contextmenu',x=>{if(S&&!S.done){x.preventDefault();v('Klik kanan',1)}});
document.addEventListener('keydown',e=>{
 if(!S||S.done)return;const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
 if(k==='f12'||(c&&e.shiftKey&&['i','j','c'].includes(k))||(c&&['u','s','p','a','c','v','x','f'].includes(k))||k==='printscreen'||(e.altKey&&k==='tab')){
  e.preventDefault();v('Pintasan terlarang: '+(c?'Ctrl+':'')+e.key,1);if(k==='printscreen'||k==='f12'||(c&&e.shiftKey))v('Mencoba tangkap layar / DevTools')}
});
addEventListener('beforeunload',e=>{if(S&&S.start&&!S.done){e.preventDefault();e.returnValue=''}});
// ===== PENGIRIMAN (penilaian dilakukan di server) =====
function finish(why){
 if(S.done)return;S.done=true;S.end=Date.now();S.why=why;save();setTimeout(hb,300);clearInterval(timer);closeM();locked=false;
 try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
 result();kirim();
}
const POST=(o)=>fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(r=>r.json());
// jawaban objektif mentah; null = belum dijawab
function jawab(){return Array.from({length:NO},(_,i)=>{const q=Q[i],a=S.ans[i];
 if(a===undefined||a===null||a==='')return null;
 if(q.y==='mt')return q.p.map((_,j)=>a[j]===undefined||a[j]===''?null:a[j]);
 return a})}
function payload(){return{a:'submit',id:S.id,sig:S.sig,n:S.nm,k:S.kl,w:Math.round(((S.end||Date.now())-S.start)/60000),why:S.why,v:S.viol,A:jawab(),es:Q.map((q,i)=>q.y==='es'?(S.ans[i]||''):null).filter(x=>x!==null)}}
function report(){return btoa(unescape(encodeURIComponent(JSON.stringify(payload()))))}
async function kirim(){
 const say=t=>{const e=$('st');if(e)e.textContent=t};
 if(S.sent)return say('✓ Hasil sudah dikirim ke guru.');
 if(!SHEET_URL)return say('Pengiriman otomatis belum diaktifkan. Kirim kode laporan ke guru.');
 const GAGAL={sig:'Sesi ujian tidak valid. Kirim kode laporan ke guru.',soal:'Versi soal tidak cocok dengan server. Kirim kode laporan ke guru.'};
 say('Mengirim jawaban ke server…');
 try{const j=await POST(payload());
  if(!j.ok)return say(GAGAL[j.err]||'Server menolak pengiriman. Tekan “Kirim ulang” atau kirim kode laporan ke guru.');
  S.sent=1;S.res={skor:j.skor,rev:j.rev};save();result();
 }catch(e){say('Gagal mengirim. Periksa koneksi lalu tekan “Kirim ulang”, atau kirim kode laporan ke guru.')}
}
function result(){
 const c=S.viol.filter(x=>!x.s).length,code=report(),sk=S.res?S.res.skor:undefined;
 const nilai=sk!=null?`<p>Skor pilihan (${NO} soal objektif):</p><div class="big">${sk}<span class="mu">/100</span></div>`
  :`<p class="mu">${S.sent?'Skor pilihan akan disampaikan oleh guru.':'Jawabanmu sedang dikirim dan dinilai oleh server…'}</p>`;
 app.innerHTML=`<div class="w"><div class="c"><h1>Ujian selesai</h1><div class="mu">${esc(S.nm)} · ${esc(S.kl)} · ${esc(S.why)}</div>${nilai}<p class="mu">Esai (5 soal) dinilai oleh guru. Pelanggaran tercatat: ${c}, catatan ringan: ${S.viol.length-c}.</p></div>
 <div class="c"><h2>Pengiriman ke guru</h2><p id="st" class="mu">${S.sent?'✓ Hasil sudah dikirim ke guru.':''}</p><button class="g" onclick="kirim()">Kirim ulang</button><h2 style="margin-top:18px">Kode laporan (cadangan)</h2><p class="mu">Salin kode ini dan kirim ke guru (chat/LMS). Berisi jawaban dan log pelanggaran; guru menilainya lewat Mode Guru.</p><pre id="cd">${code}</pre><button onclick="navigator.clipboard&&navigator.clipboard.writeText($('cd').textContent).then(()=>this.textContent='Tersalin ✓')">Salin kode</button> <button class="g" onclick="localStorage.removeItem(KEY);S=null;login()">Keluar</button></div>${S.res&&S.res.rev?`<h2 style="margin:18px 0 8px">Pembahasan</h2>`+S.res.rev.map((r,i)=>item(i,r,true)).join(''):''}</div>`;
}
// ===== PEMBAHASAN (kunci hanya datang dari server) =====
function tx(i,a){const q=Q[i];
 if(a===undefined||a===null||a==='')return '(kosong)';
 if(q.y==='pg')return q.o[a];
 if(q.y==='pk')return a.length?a.map(x=>q.o[x]).join('; '):'(kosong)';
 if(q.y==='bs')return a?'Benar':'Salah';
 return q.p.map((p,j)=>p+' → '+(a[j]===undefined||a[j]===null||a[j]===''?'?':q.o[a[j]])).join(' | ')}
function item(i,r,own){const q=Q[i],sc=own?r.s:0;
 const st=!own?'':sc===1?'<span style="color:var(--ok)">✓ Benar</span>':sc>0?'<span style="color:var(--wa)">◐ Sebagian</span>':'<span style="color:var(--er)">✗ Salah</span>';
 return `<div class="c"><b>No. ${i+1}</b> ${st}<p style="white-space:pre-line">${esc(q.t)}</p>${own?`<div class="mu">Jawabanmu: ${esc(tx(i,S.ans[i]))}</div>`:''}<div class="mu">Kunci: <b>${esc(tx(i,r.k))}</b></div><div class="mu">${esc(r.x||'')}</div></div>`}
// ===== MODE GURU (semua data sensitif diminta dari server dengan kata sandi) =====
function teacher(){app.innerHTML=`<div class="w"><div class="c"><h1>Mode Guru</h1><label>Kata sandi guru<input id="pw" type="password" autocomplete="off"></label><button onclick="cekGuru()">Masuk</button> <button class="g" onclick="S?result():login()">Kembali</button><p id="er" style="color:var(--er)"></p></div></div>`}
function guruUI(){app.innerHTML=`<div class="w"><div class="c"><h1>Mode Guru</h1><p class="mu">Tempel kode laporan siswa untuk melihat skor, log kecurangan, soal yang salah, dan jawaban esai. Penilaian dihitung ulang di server.</p><textarea id="cd" rows="5" placeholder="Tempel kode laporan…"></textarea><button onclick="decode()">Tampilkan</button> <button class="g" onclick="kunci()">Kunci &amp; nomor soal</button> <button class="g" onclick="GP='';S?result():login()">Keluar</button><div id="rp"></div></div></div>`}
const rpErr=t=>$('rp').innerHTML=`<p style="color:var(--er)">${t}</p>`;
async function kunci(){
 $('rp').innerHTML='<p class="mu">Memuat kunci dari server…</p>';
 try{const K=await ga({a:'kunci'});if(K.err)return rpErr('Kata sandi tidak valid. Masuk ulang.');
  $('rp').innerHTML='<hr><h2>Kunci &amp; pembahasan (No. 1–'+NO+')</h2>'+K.kunci.map((k,i)=>item(i,{k,x:K.ex[i]},false)).join('')+'<h2>Kunci esai</h2>'+Q.map((q,i)=>q.y==='es'?`<div class="c"><b>No. ${i+1}</b><p style="white-space:pre-line">${esc(q.t)}</p><div class="mu">Kunci: ${esc(K.esai[i-NO])}</div></div>`:'').join('')}
 catch(e){rpErr('Tidak dapat terhubung ke server.')}}
async function decode(){
 let r;try{r=JSON.parse(decodeURIComponent(escape(atob($('cd').value.trim()))))}catch(e){return rpErr('Kode tidak valid.')}
 $('rp').innerHTML='<p class="mu">Menilai di server…</p>';
 try{const j=await POST({a:'decode',pw:GP,r});
  if(j.err)return rpErr(j.err==='auth'?'Kata sandi tidak valid. Masuk ulang.':'Kode tidak valid.');
  const c=j.v.filter(x=>!x.s).length,st=c>=MAX?['Dicurigai berat','var(--er)']:c>0?['Perlu ditinjau','var(--wa)']:['Aman','var(--ok)'];
  const sl=j.d.map((x,i)=>x<1?(i+1)+(x>0?' (sebagian)':''):null).filter(Boolean);
  $('rp').innerHTML=`<hr><h2>${esc(j.n)} · ${esc(j.k)}</h2><p>Skor objektif: <b>${j.skor}/100</b> · Durasi: ${j.w} menit · ${esc(j.why)}<br>Status: <b style="color:${st[1]}">${st[0]}</b> (${c} pelanggaran, ${j.v.length-c} catatan ringan)</p>
  <p>Soal salah / kurang: <b>${sl.length?sl.join(', '):'tidak ada'}</b></p>
  <h2>Log pelanggaran</h2>${j.v.length?j.v.map(x=>`<div class="mu">${esc(x.t)} — ${esc(x.m)} ${x.s?'(ringan)':''}</div>`).join(''):'<div class="mu">Tidak ada.</div>'}
  <h2 style="margin-top:14px">Jawaban esai</h2>${j.es.map((a,i)=>`<div class="c"><b>Esai ${i+1}</b><p style="white-space:pre-wrap">${esc(a||'(kosong)')}</p><div class="mu">Kunci: ${esc(j.esaiKunci[i])}</div></div>`).join('')}`;
 }catch(e){rpErr('Tidak dapat terhubung ke server.')}
}
// ===== KONTROL JARAK JAUH (siswa) =====
async function hb(){
 if(!SHEET_URL||!S||!S.start)return;
 try{const left=Math.max(0,(S.start+DUR*60000+(S.extra||0)-Date.now())/1000|0);
  const q=new URLSearchParams({a:'hb',id:S.id,n:S.nm,k:S.kl,i:(S.i||0)+1,q:Q.filter((_,x)=>ok(x)).length,v:S.viol.filter(x=>!x.s).length,s:S.done?0:left,d:S.done?1:0});
  const j=await(await fetch(SHEET_URL+'?'+q)).json();(j.cmds||[]).forEach(doCmd)}catch(e){}
}
function doCmd(c){
 if(!S)return;
 if(c.op==='add'&&!S.done){S.extra=(S.extra||0)+(+c.val||0)*60000;save();if($('tm'))tick()}
 if(c.op==='kumpul'&&!S.done)finish('Dikumpulkan oleh guru');
 if(c.op==='msg')modal(`<h2>Pesan dari guru</h2><p style="white-space:pre-line">${esc(c.val)}</p><button onclick="closeM()">Oke</button>`);
 if(c.op==='reset'){clearInterval(timer);try{localStorage.removeItem(KEY)}catch(e){}S=null;locked=false;closeM();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}login('Ujianmu direset oleh guru. Silakan masuk lagi.')}
}
setInterval(hb,25000);
// ===== PANEL KONTROL (guru) =====
let GP='',lt=null;
const ga=async o=>(await fetch(SHEET_URL+'?'+new URLSearchParams({...o,pw:GP}))).json();
function panel(){
 app.innerHTML=`<div class="w"><div class="c"><h1>Panel Kontrol</h1><div class="mu" id="cf">Memuat…</div>
 <div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button onclick="ctl('open')">Buka ujian</button><button class="d" onclick="ctl('close')">Tutup ujian</button><button class="g" onclick="tc('all','msg')">Pesan ke semua</button><button class="g" onclick="tc('all','add')">+ Waktu semua</button><button class="g" onclick="tc('all','kumpul')">Kumpulkan semua</button><button class="g" onclick="guruUI()">Periksa laporan</button><button class="g" onclick="clearInterval(lt);login()">Keluar</button></div></div>
 <div class="c" id="lv"></div></div>`;
 pull();clearInterval(lt);lt=setInterval(pull,10000);
}
async function ctl(op){try{await ga({a:'ctl',op});pull()}catch(e){alert('Gagal menghubungi server.')}}
async function tc(id,op){let val='';
 if(op==='add'){val=prompt('Tambah berapa menit?','5');if(!val)return}
 if(op==='msg'){val=prompt('Isi pesan untuk siswa:');if(!val)return}
 if(op==='kumpul'&&!confirm('Paksa kumpulkan jawaban '+(id==='all'?'SEMUA siswa yang masih mengerjakan':'siswa ini')+'?'))return;
 if(op==='reset'&&!confirm('Reset siswa ini? Jawaban di perangkatnya dihapus dan ia harus masuk lagi.'))return;
 try{await ga({a:'cmd',id,op,val});pull()}catch(e){alert('Gagal menghubungi server.')}}
function rowH(r,now){const ago=(now-r.t)/1000|0,st=r.d?'Selesai':ago>90?'Offline '+ago+' dtk':'Mengerjakan',col=r.d?'var(--ok)':ago>90?'var(--wa)':'var(--pr)';
 return `<div style="border-top:2px solid var(--bd);padding:12px 0"><b>${esc(r.n)}</b> · ${esc(r.k)} <span class="tag" style="background:${col};color:#fff">${st}</span>
 <div class="mu">Soal ke-${r.i} · terjawab ${r.a}/${Q.length} · sisa ${Math.floor(r.s/60)}:${String(r.s%60).padStart(2,'0')} · <b style="color:${r.v?'var(--er)':'inherit'}">pelanggaran ${r.v}/${MAX}</b></div>
 <div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-top:8px"><button class="g" onclick="tc(${r.id},'add')">+ Waktu</button><button class="g" onclick="tc(${r.id},'msg')">Pesan</button><button class="g" onclick="tc(${r.id},'kumpul')">Kumpulkan</button><button class="g" onclick="tc(${r.id},'reset')">Reset</button></div></div>`}
async function pull(){if(!$('lv'))return clearInterval(lt);
 try{const j=await ga({a:'list'});if(j.err)return;
  $('cf').innerHTML='Status ujian: <b>'+(j.open?'DIBUKA':'DITUTUP')+'</b> · '+j.rows.length+' siswa tercatat · diperbarui tiap 10 detik';
  $('lv').innerHTML=j.rows.length?j.rows.sort((a,b)=>b.v-a.v||a.n.localeCompare(b.n)).map(r=>rowH(r,j.now)).join(''):'<span class="mu">Belum ada siswa yang masuk.</span>'}
 catch(e){$('lv').innerHTML='<span class="mu">Gagal memuat, mencoba lagi…</span>'}}
async function cekGuru(){const pw=$('pw').value;
 if(!SHEET_URL)return $('er').textContent='Alamat server (SHEET_URL) belum diisi di file HTML.';
 GP=pw;try{const j=await ga({a:'list'});if(j.err){GP='';return $('er').textContent='Kata sandi salah.'}panel()}catch(e){$('er').textContent='Tidak dapat terhubung ke server.'}}
// ===== MULAI =====
if(S&&S.done){result();if(!S.sent)kirim()}
else if(S&&S.start){S.viol.push({t:new Date().toLocaleTimeString('id-ID'),m:'Halaman dimuat ulang / ditutup saat ujian',s:0});save();
 if(S.viol.filter(x=>!x.s).length>=MAX)finish('Melebihi batas pelanggaran');
 else{run();locked=true;modal(`<h2 style="color:var(--er)">⚠ Halaman dimuat ulang</h2><p>Ini dicatat sebagai pelanggaran (${S.viol.filter(x=>!x.s).length}/${MAX}). Waktu ujian tetap berjalan.</p><button onclick="locked=false;closeM();audioInit();fs();last=Date.now()">Lanjutkan ujian</button>`)}}
else login();
</script>
</body>
</html>
